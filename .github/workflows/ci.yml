# Every push and pull request: types, tests, the security suite, a dependency
# audit and a secret scan. Actions are pinned to commit SHAs (a moved tag
# cannot change what runs here), the token can only read, and checkout does
# not leave credentials behind for later steps.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 — version from packageManager
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install (lockfile only, supply-chain policies enforced)
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm -r --parallel exec tsc --noEmit -p .
      - name: Unit tests
        run: pnpm -r test
      # In a real browser (the runner's own Google Chrome — nothing downloaded):
      # the spreadsheet keys, drag, paste and the row menu, which a simulated
      # DOM cannot test. Added 6 Oct after a 14px sideways slide shipped.
      - name: Browser tests
        run: pnpm --filter @opencall/web test:browser
      - name: Security suite (locked server, access matrix)
        run: pnpm test:security
      - name: Dependency audit (production dependencies, high and above)
        run: pnpm audit --prod --audit-level high

  # Every screen at phone, tablet, laptop and desktop sizes, against a real
  # production build on a throwaway database: nothing off the edge, no
  # sideways slide, nothing too small for a finger. Also the only place CI
  # builds the web app, so a build that would fail on Railway fails here.
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 — version from packageManager
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install (lockfile only)
        run: pnpm install --frozen-lockfile
      - name: Every screen at every size
        run: pnpm test:layout

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan the pushed commits for secrets (gitleaks, pinned by digest)
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then RANGE="$AFTER~1..$AFTER"; else RANGE="$BEFORE..$AFTER"; fi
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --config .gitleaks.toml --log-opts="$RANGE" --redact --exit-code 1 .
